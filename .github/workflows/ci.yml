name: build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-22.04
    container: ros:humble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/autoware_sim_demo
      - name: Install dependencies (README quick start)
        run: |
          apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src -y
      - name: Build
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --packages-select autoware_sim_demo --event-handlers console_direct+
      - name: Executable and launch file installed
        run: |
          source install/setup.bash
          ros2 pkg executables autoware_sim_demo | grep -q autoware_sim_demo
          test -f install/autoware_sim_demo/share/autoware_sim_demo/launch/basic_simulation.launch.py
