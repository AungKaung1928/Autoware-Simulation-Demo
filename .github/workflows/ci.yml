name: build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    container: ros:humble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/autoware_sim_demo
      - name: Install dependencies (README quick start)
        run: |
          apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src -y
      - name: Build
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --packages-select autoware_sim_demo --event-handlers console_direct+
      - name: Executable and launch file installed
        run: |
          source install/setup.bash
          ros2 pkg executables autoware_sim_demo | grep -q autoware_sim_demo
          test -f install/autoware_sim_demo/share/autoware_sim_demo/launch/basic_simulation.launch.py
      - name: Pipeline launch test (shipped launch file, closed loop to a goal)
        run: |
          source install/setup.bash
          cd src/autoware_sim_demo
          TRAJ_CSV=$GITHUB_WORKSPACE/trajectory.csv launch_test test/test_launch_pipeline.py
          python3 scripts/plot_trajectory.py $GITHUB_WORKSPACE/trajectory.csv $GITHUB_WORKSPACE/trajectory.svg
          PIPELINE_GOAL=20,5 launch_test test/test_launch_pipeline.py   # README headline: goal (20, 5)
      - name: Upload the trajectory
        uses: actions/upload-artifact@v4
        with:
          name: trajectory
          path: |
            trajectory.csv
            trajectory.svg
